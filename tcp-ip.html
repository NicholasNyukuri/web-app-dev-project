<p>TCP/IP is a communication protocol suite used to connect devices on the Internet.</p>
<p>The TCP/IP is the fundamental communication protocol of the internet.
   TCP: Breaks data into packets and ensures reliable delivery
   IP: Handles addressing and routing of packets</p>
